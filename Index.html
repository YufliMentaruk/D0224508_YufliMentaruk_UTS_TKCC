<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daily Activity Tracker</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 150px;
        }

        input {
            padding: 5px;
        }

        button {
            padding: 6px 10px;
            margin-top: 10px;
        }

        li {
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h2>Daily Activity Tracker</h2>

    <div class="form-group">
        <label for="activity">Aktivitas:</label>
        <input type="text" id="activity" placeholder="Nama aktivitas">
    </div>

    <div class="form-group">
        <label for="duration">Durasi (menit):</label>
        <input type="number" id="duration" placeholder="Durasi">
    </div>

    <button id="btnTambah">Tambah</button>

    <h3 id="total">Total: 0 Menit (0 Aktivitas)</h3>

    <ul id="list"></ul>

    <script>
        const btn = document.getElementById("btnTambah");
        const list = document.getElementById("list");
        const totalText = document.getElementById("total");

        // state (data disimpan di sini)
        let activities = [];

        btn.addEventListener("click", function () {
            const activityInput = document.getElementById("activity");
            const durationInput = document.getElementById("duration");

            const name = activityInput.value;
            const duration = parseInt(durationInput.value);

            // validasi
            if (name === "" || isNaN(duration)) {
                alert("Input tidak valid!");
                return;
            }

            // simpan ke array
            activities.push({
                name: name,
                duration: duration
            });

            render();

            // reset input
            activityInput.value = "";
            durationInput.value = "";
        });

        // fungsi render (inti dari aplikasi)
        function render() {
            list.innerHTML = "";

            let total = 0;

            activities.forEach((item) => {
                total += item.duration;

                const li = document.createElement("li");
                li.textContent = item.name + " - " + item.duration + " menit";

                list.appendChild(li);
            });

            totalText.textContent =
                "Total: " + total + " Menit (" + activities.length + " Aktivitas)";
        }
    </script>

</body>
</html>
